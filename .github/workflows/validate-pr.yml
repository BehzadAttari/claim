# Checks every page file a PR touches and reports back in a friendly comment.
name: Check page claims
on:
  pull_request:
    branches: [main]
    paths: ["pages/**", "schema/**", "scripts/**", "reserved.json", "config.json"]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build-index
      - name: Run checks
        id: check
        run: |
          set +e
          npx tsx scripts/src/validate.ts \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --author "${{ github.event.pull_request.user.login }}" \
            --maintainers "${{ vars.MAINTAINERS }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Apply labels
        # Fork PR tokens are read-only. Keep validation, but skip bot writes.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(node -p "JSON.parse(require('fs').readFileSync('validation-report.json','utf8')).labels.join(',')")
          if [ -n "$LABELS" ]; then
            gh pr edit "${{ github.event.pull_request.number }}" --add-label "$LABELS" || true
          fi
      - name: Post the review comment
        # Fork PR tokens are read-only. Keep validation, but skip bot writes.
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
      - name: Share the review in the job summary
        # Fork PR tokens are read-only, so bot comments are skipped - but the
        # job summary is visible to everyone, including fork PRs.
        if: always()
        run: |
          if [ -f comment.md ]; then cat comment.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail the check when validation failed
        if: steps.check.outputs.exit != '0'
        run: exit 1
