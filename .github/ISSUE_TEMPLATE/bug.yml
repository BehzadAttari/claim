name: Something is broken
description: A page, the checker, or the site isn't working. For the title, write a short, specific summary - no [Bug] prefix needed, the label is added for you.
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where's the problem?
      placeholder: e.g. dhanush.got-a.page, the claim checker on my PR
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
